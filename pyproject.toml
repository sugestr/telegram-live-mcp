[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-live-mcp"
version = "0.1.0"
description = "Local read-only Telegram MCP server for Codex, with independent account sign-in"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Telethon>=1.40,<2", "segno>=1.6,<2"]

[project.scripts]
telegram-live = "telegram_live_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
